name: Build TranslateAll (.apk & .ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android TV & Mobile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Protected Key Injection)
        run: npm run build
        env:
          VITE_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslateAll-Android-TV.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS Archive / IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Protected Key Injection)
        run: npm run build
        env:
          VITE_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -destination generic/platform=iOS -configuration Release archive -archivePath build/TranslateAll.xcarchive CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: TranslateAll-iOS-Archive
          path: ios/App/build/TranslateAll.xcarchive
