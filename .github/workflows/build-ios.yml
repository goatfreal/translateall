name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Native iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build
        env:
          VITE_NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App (.app)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .app into .ipa
        run: |
          mkdir -p build-output/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app build-output/Payload/TranslateAll.app
          cd build-output
          zip -r TranslateAll.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TranslateAll-iOS-IPA
          path: build-output/TranslateAll.ipa
          retention-days: 14
